<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechnoQuest - Digital Dungeon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">⚔️ TECHONOQUEST</div>

    <div class="player-info">
        <span>Level: <b id="level">1</b></span>
        <span>XP: <b id="xp">0</b>/<b id="xpNeeded">100</b></span>
        <span>💰 <b id="coins">0</b></span>
    </div>
</header>

<main>

    <!-- PLAYER STATS -->
    <section class="stats">
        <div class="stat-box">
            ❤️ Health
            <div class="health-bar">
                <div id="healthBar"></div>
            </div>
            <span id="healthText">100 / 100</span>
        </div>

        <div class="stat-box">
            ⭐ Experience
            <div class="xp-bar">
                <div id="xpBar"></div>
            </div>
        </div>
    </section>


    <!-- DUNGEON -->
    <section class="dungeon">

        <h1>🏰 DIGITAL DUNGEON</h1>
        <p class="subtitle">Explore the dungeon and master computer literacy.</p>

        <div class="map">

            <button class="room unlocked" data-room="computer">
                <span class="room-icon">🖥️</span>
                <span>Computer Cavern</span>
                <small>Computer Basics</small>
            </button>

            <button class="room locked" data-room="keyboard">
                <span class="room-icon">⌨️</span>
                <span>Keyboard Castle</span>
                <small>Locked</small>
            </button>

            <button class="room locked" data-room="files">
                <span class="room-icon">📁</span>
                <span>File Forest</span>
                <small>Locked</small>
            </button>

            <button class="room locked" data-room="internet">
                <span class="room-icon">🌐</span>
                <span>Internet Ruins</span>
                <small>Locked</small>
            </button>

            <button class="room locked" data-room="security">
                <span class="room-icon">🔐</span>
                <span>Cyber Dungeon</span>
                <small>Locked</small>
            </button>

            <button class="room locked" data-room="coding">
                <span class="room-icon">💻</span>
                <span>Coding Labyrinth</span>
                <small>Locked</small>
            </button>

            <button class="room locked boss-room" data-room="boss">
                <span class="room-icon">👑</span>
                <span>Digital Overlord</span>
                <small>FINAL BOSS</small>
            </button>

        </div>
    </section>


    <!-- QUESTION MODAL -->
    <div id="questionModal" class="modal hidden">

        <div class="modal-content">

            <button id="closeQuestion" class="close">✕</button>

            <div id="enemyArea">
                <div id="enemyIcon">👾</div>
                <h2 id="enemyName">Digital Enemy</h2>

                <div class="enemy-health">
                    <div id="enemyHealthBar"></div>
                </div>

                <p id="enemyHealthText">50 / 50 HP</p>
            </div>

            <div class="question-area">

                <p id="questionNumber">Question 1</p>

                <h2 id="questionText">
                    Question goes here
                </h2>

                <div id="answers"></div>

                <p id="feedback"></p>

                <button id="nextQuestion" class="next-btn">
                    Next Question
                </button>

            </div>

        </div>

    </div>


    <!-- MESSAGE -->
    <div id="messageBox" class="message hidden">
        <h2 id="messageTitle">Mission Complete!</h2>
        <p id="messageText"></p>
        <button id="messageButton">Continue</button>
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
