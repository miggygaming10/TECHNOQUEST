<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TechnoQuest</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- GAME WORLD -->
    <div id="world">

        <div class="title">TECHNOQUEST</div>

        <!-- DECORATIONS -->
        <div class="tree" style="left:100px;top:100px;">🌳</div>
        <div class="tree" style="left:650px;top:120px;">🌳</div>
        <div class="tree" style="left:120px;top:600px;">🌳</div>
        <div class="tree" style="left:800px;top:550px;">🌳</div>

        <div class="rock" style="left:450px;top:100px;">🪨</div>
        <div class="rock" style="left:300px;top:500px;">🪨</div>

        <!-- INTERACTABLE OBJECTS -->

        <div class="object computer"
             data-name="Computer Terminal"
             data-type="computer"
             style="left:350px;top:220px;">
            🖥️
            <span>Computer</span>
        </div>

        <div class="object chest"
             data-name="Mystery Chest"
             data-type="chest"
             style="left:700px;top:300px;">
            📦
            <span>Chest</span>
        </div>

        <div class="object npc"
             data-name="Teacher"
             data-type="npc"
             style="left:180px;top:350px;">
            👨‍🏫
            <span>Teacher</span>
        </div>

        <div class="object door"
             data-name="Dungeon Gate"
             data-type="door"
             style="left:500px;top:600px;">
            🚪
            <span>Dungeon Gate</span>
        </div>

        <!-- PLAYER -->
        <div id="player">
            🧙
        </div>

    </div>


    <!-- TOP UI -->
    <div id="topUI">

        <div class="player-card">
            <b>⚔️ TECH WARRIOR</b>
            <span>Level <b id="level">1</b></span>
        </div>

        <div class="xp-card">
            ⭐ XP:
            <span id="xp">0</span> /
            <span id="xpNeeded">100</span>

            <div class="xp-bar">
                <div id="xpFill"></div>
            </div>
        </div>

    </div>


    <!-- INTERACTION -->
    <div id="interaction">
        <div id="interactionText">
            COMPUTER
        </div>

        <button id="interactButton">
            INTERACT
        </button>
    </div>


    <!-- JOYSTICK -->
    <div id="joystick">

        <div id="joystickBase">
            <div id="joystickStick"></div>
        </div>

    </div>


    <!-- QUESTION WINDOW -->
    <div id="questionScreen">

        <div class="question-box">

            <button id="closeQuestion">✕</button>

            <div id="questionIcon">🖥️</div>

            <h2 id="questionTitle">
                Computer Challenge
            </h2>

            <p id="questionCounter">
                Question 1
            </p>

            <h3 id="questionText">
                Question
            </h3>

            <div id="answers"></div>

            <div id="feedback"></div>

            <button id="nextButton">
                NEXT
            </button>

        </div>

    </div>


    <!-- MESSAGE -->
    <div id="messageScreen">

        <div class="message-box">

            <h2 id="messageTitle">
                Mission Complete!
            </h2>

            <p id="messageText"></p>

            <button id="messageButton">
                CONTINUE
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
